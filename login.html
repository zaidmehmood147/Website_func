<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GLOW — Sign In</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .auth-panel-brand { background: linear-gradient(160deg, var(--wine) 0%, #3a0f15 100%); }
    .brand-quote {
      font-family:'Cormorant Garamond',serif;
      font-size:1.12rem; font-style:italic; font-weight:300;
      color:rgba(255,255,255,.58); text-align:center;
      max-width:270px; line-height:1.75;
      animation:fadeUp .9s ease .55s both;
    }
  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>

<main class="auth-page">
  <div class="auth-panel-brand">
    <div class="brand-name">GLOW</div>
    <div class="brand-tag">Scientific Purity</div>
    <div class="brand-divider"></div>
    <p class="brand-quote">"Luxury is not about price. It is the feeling of being perfectly cared for."</p>
  </div>

  <div class="auth-panel-form">
    <div class="auth-form-inner">
      <h1 class="auth-heading">Welcome<br><em>Back</em></h1>
      <p class="auth-sub">Sign in to your GLOW account</p>

      <div class="auth-error"   id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <div class="auth-field">
        <label for="loginEmail">Email or Username</label>
        <input type="text" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="auth-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <button class="auth-btn" id="loginBtn">Sign In</button>

      <div class="auth-divider">
        <div class="auth-divider-line"></div>
        <span class="auth-divider-text">or</span>
        <div class="auth-divider-line"></div>
      </div>

      <button class="auth-google-btn" id="googleBtn">
        <svg class="g-icon" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.1 0 5.8 1.1 8 2.9l6-6C34.5 3.1 29.6 1 24 1 14.8 1 6.9 6.6 3.4 14.5l7 5.4C12 14.2 17.5 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.5 5.8C43.9 37.1 46.5 31.3 46.5 24.5z"/>
          <path fill="#FBBC05" d="M10.4 28.1A14.7 14.7 0 019.5 24c0-1.4.2-2.8.6-4.1l-7-5.4A23.8 23.8 0 001 24c0 3.9.9 7.6 2.5 10.8l6.9-6.7z"/>
          <path fill="#34A853" d="M24 47c5.5 0 10.2-1.8 13.6-4.9l-7.5-5.8c-1.8 1.2-4.1 1.9-6.1 1.9-6.4 0-11.9-4.4-13.8-10.3l-7 6.9C6.8 41.3 14.8 47 24 47z"/>
        </svg>
        Continue with Google
      </button>

      <p class="auth-footer">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </div>
</main>

<script type="module">
  import { checkAdminBypass, signInEmail, signInGoogle, getFriendlyError, initCursor } from "./app.js";
  initCursor();

  const loginBtn   = document.getElementById('loginBtn');
  const googleBtn  = document.getElementById('googleBtn');
  const errorBox   = document.getElementById('authError');
  const successBox = document.getElementById('authSuccess');

  function showError(msg)   { errorBox.textContent = msg; errorBox.classList.add('show'); successBox.classList.remove('show'); }
  function showSuccess(msg) { successBox.textContent = msg; successBox.classList.add('show'); errorBox.classList.remove('show'); }
  function setLoad(btn, on, lbl) { btn.disabled = on; btn.innerHTML = on ? `<span class="spinner"></span>${lbl}` : lbl; }

  loginBtn.addEventListener('click', async () => {
    const id  = document.getElementById('loginEmail').value.trim();
    const pw  = document.getElementById('loginPassword').value;
    if (!id || !pw) { showError('Please enter your email and password.'); return; }

    // ── ADMIN BYPASS — fires BEFORE Firebase ──
    if (checkAdminBypass(id, pw)) return;

    setLoad(loginBtn, true, 'Signing In…');
    try {
      await signInEmail(id, pw);
      showSuccess('Signed in! Redirecting…');
      setTimeout(() => window.location.href = 'index.html', 1100);
    } catch (e) {
      showError(getFriendlyError(e.code));
    } finally {
      setLoad(loginBtn, false, 'Sign In');
    }
  });

  googleBtn.addEventListener('click', async () => {
    setLoad(googleBtn, true, 'Opening Google…');
    try {
      await signInGoogle();
      showSuccess('Signed in with Google! Redirecting…');
      setTimeout(() => window.location.href = 'index.html', 1100);
    } catch (e) {
      showError(getFriendlyError(e.code));
      setLoad(googleBtn, false, 'Continue with Google');
    }
  });

  document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });
</script>
</body>
</html>
